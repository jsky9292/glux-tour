<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLUX Tour Voucher Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;font-size:13px;background:#f0f2f5}
#wrap{display:flex;height:100vh;height:100dvh;overflow:hidden}
#side{width:360px;min-width:360px;background:#fff;display:flex;flex-direction:column;border-right:1px solid #e5e7eb;overflow:hidden}
#side-head{background:#0f0f1a;padding:12px 16px;flex-shrink:0}
#side-head .logo{font-family:Arial,sans-serif;font-size:16px;font-weight:900;letter-spacing:3px;color:#fff}
#side-head .logo b{color:#D9251C}
#side-head p{font-size:10px;color:#6b7280;margin-top:2px}

/* DB 연동 배너 */
#db-banner{background:#eff6ff;border-bottom:2px solid #bfdbfe;padding:8px 14px;flex-shrink:0;display:none}
#db-banner .brow{display:flex;justify-content:space-between;align-items:center}
#db-banner .binfo{font-size:11px;color:#1e40af;font-weight:600}
#db-banner .bsub{font-size:10px;color:#3b82f6;margin-top:2px}
#db-mode-badge{background:#1d4ed8;color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px}

#savebar{background:#f0fdf4;border-bottom:1px solid #bbf7d0;padding:5px 14px;font-size:10px;color:#166534;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
#tabs{display:flex;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.tb{flex:1;padding:9px 4px;font-size:11px;font-weight:600;text-align:center;cursor:pointer;border:none;border-bottom:2px solid transparent;color:#9ca3af;background:none;font-family:'Noto Sans KR',sans-serif}
.tb.on{color:#D9251C;border-bottom-color:#D9251C}
#fscroll{overflow-y:auto;flex:1;min-height:0;padding:14px}
#fscroll::-webkit-scrollbar{width:4px}
#fscroll::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
.sec{display:none}.sec.on{display:block}
.stit{font-size:10px;font-weight:700;color:#D9251C;text-transform:uppercase;letter-spacing:1px;padding:8px 0 6px;border-bottom:1px solid #fecaca;margin-bottom:10px}
.f{margin-bottom:9px}
.f label{display:block;font-size:11px;font-weight:600;color:#374151;margin-bottom:3px}
.f input,.f textarea{width:100%;padding:7px 9px;border:1px solid #d1d5db;border-radius:5px;font-family:'Noto Sans KR',sans-serif;font-size:12px;background:#fafafa;color:#1a1a2e}
.f input:focus,.f textarea:focus{outline:none;border-color:#D9251C;background:#fff}
.f textarea{resize:vertical;min-height:130px;line-height:1.6}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cw{background:#fafafa;border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-bottom:10px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ch span{font-size:12px;font-weight:700}
.cn{background:none;border:1px solid #e5e7eb;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:12px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cdn{text-align:center;font-size:9px;font-weight:700;color:#9ca3af;padding:3px 0}
.cd{text-align:center;font-size:11px;padding:5px 2px;cursor:pointer;border-radius:4px;border:none;background:none;font-family:'Noto Sans KR',sans-serif;width:100%}
.cd:hover:not(:disabled){background:#fee2e2;color:#D9251C}
.cd.today{font-weight:700;color:#D9251C}
.cd.sel{background:#D9251C!important;color:#fff!important;font-weight:700}
.cd.inr{background:#fecaca;color:#991b1b}
.cd.sun{color:#ef4444}.cd.sat{color:#3b82f6}
.cd.sel.sun,.cd.sel.sat{color:#fff}
.cd:disabled{opacity:.3;cursor:default}
.tbns{display:flex;gap:6px;margin-bottom:10px}
.tbn{flex:1;padding:8px 4px;border:1.5px solid #e5e7eb;border-radius:6px;background:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:#374151;text-align:center}
.tbn.on{border-color:#D9251C;background:#fff5f5;color:#D9251C}
#selinfo{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:7px 10px;font-size:11px;color:#1d4ed8;margin-bottom:10px;display:none}
.dc{background:#fafafa;border:1px solid #e5e7eb;border-radius:7px;padding:10px;margin-bottom:10px}
.dch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dct{font-size:11px;font-weight:700}
.bdd{background:#fee2e2;color:#D9251C;border:none;border-radius:4px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer}
.sr{background:#fff;border:1px solid #e5e7eb;border-radius:5px;padding:7px;margin-bottom:5px}
.srh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.srn{font-size:10px;font-weight:700;color:#6b7280}
.bdr{background:none;border:none;cursor:pointer;color:#9ca3af;font-size:13px;padding:0}
.sg{display:grid;grid-template-columns:1fr 1fr 55px;gap:3px}
.sg .f{margin-bottom:3px}
.sg .f label{font-size:9px}
.sg .f input{padding:4px 6px;font-size:11px}
.sw{grid-column:1/-1}
.badd{width:100%;padding:7px;border:1.5px dashed #d1d5db;border-radius:5px;background:none;cursor:pointer;font-size:11px;color:#6b7280;font-weight:600;font-family:'Noto Sans KR',sans-serif;margin-bottom:4px}
.badd:hover{border-color:#D9251C;color:#D9251C}
#acts{padding:10px 14px;border-top:1px solid #e5e7eb;display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap}
.act{flex:1;padding:9px 4px;font-size:11px;font-weight:700;cursor:pointer;border:none;border-radius:7px;font-family:'Noto Sans KR',sans-serif;min-width:0}
.av{background:#166534;color:#fff}
.ap{background:#D9251C;color:#fff}
.as{background:#0f0f1a;color:#fff}
.ag{background:#f3f4f6;color:#374151}
.ar{background:#fee2e2;color:#D9251C;flex:0.4!important}
.ab{background:#1d4ed8;color:#fff}
.ae{background:#059669;color:#fff}
#prev{flex:1;background:#e5e7eb;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:20px 0}
#a4w{transform-origin:top center;display:flex;flex-direction:column;align-items:center}
.a4{width:794px;min-height:1123px;background:#fff;box-shadow:0 3px 20px rgba(0,0,0,.15);padding:68px 68px 68px 76px;margin-bottom:20px;flex-shrink:0}
.vh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.vlogo{font-family:Arial,sans-serif;font-size:28px;font-weight:900;letter-spacing:3px}
.vlogo b{color:#D9251C}
.vtr{text-align:right}
.vtit{font-family:Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:3px}
.vtit b{color:#D9251C}
.vsub{font-size:8px;color:#6b7280;line-height:1.6;margin-top:3px}
.vline{background:#0f0f1a;height:5px;border-radius:2px;margin-bottom:13px}
.vlb{font-size:11px;font-weight:700;letter-spacing:1.5px;border-left:3px solid #D9251C;padding-left:8px;margin:13px 0 7px}
table.vt{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:9px;page-break-inside:avoid;break-inside:avoid}
.vt th{background:#f3f4f6;border:.5px solid #d1d5db;padding:7px 9px;text-align:center;font-size:11px;color:#374151}
.vt td{border:.5px solid #d1d5db;padding:7px 9px;vertical-align:middle}
.vt .lc{background:#f9fafb;font-weight:700;font-size:11px;color:#374151;text-align:center;width:88px}
.vt .vs{font-size:8px;color:#9ca3af;font-weight:400;display:block;margin-top:1px}
.dh{background:#0f0f1a;color:#fff;padding:7px 12px;font-size:13px;font-weight:700;margin:13px 0 9px;display:flex;align-items:center;gap:5px}
.dh b{color:#D9251C}
.uli{font-size:12px;line-height:2;list-style:none}
.uli li{padding-left:10px;position:relative}
.uli li::before{content:'·';position:absolute;left:0;color:#D9251C}
.cb{background:#fafafa;border-top:1px solid #e5e7eb;padding:9px 12px;margin-top:12px;font-size:9px;line-height:1.9}
.cb p{padding-left:14px;position:relative;margin-bottom:1px}
.cb p::before{content:'**';position:absolute;left:0;color:#D9251C;font-weight:700}
#mbar{display:none;position:fixed;top:0;left:0;right:0;height:46px;z-index:999;background:#0f0f1a;align-items:center;justify-content:space-between;padding:0 14px}
#mbar .logo{font-family:Arial,sans-serif;font-size:15px;font-weight:900;letter-spacing:2px;color:#fff}
#mbar .logo b{color:#D9251C}
#mtogbtn{background:#D9251C;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#0f0f1a;color:#fff;padding:7px 18px;border-radius:20px;font-size:11px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.date-input-btn{cursor:pointer!important;caret-color:transparent;background:#fafafa}
.date-input-btn.filled{color:#D9251C;font-weight:600;background:#fff5f5;border-color:#fecaca}
#cal-modal{display:none;position:fixed;inset:0;z-index:2000}
#cal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#cal-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:18px;width:318px;max-width:94vw;z-index:1;box-shadow:0 16px 56px rgba(0,0,0,.28)}
#cal-popup-title{font-size:13px;font-weight:700;color:#0f0f1a;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#cal-popup-title span{font-size:10px;font-weight:400;color:#6b7280}
#cal-selinfo{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:7px 10px;font-size:11px;color:#1d4ed8;margin:8px 0;display:none}
#cal-confirm{width:100%;padding:10px;background:#D9251C;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:8px}
#cal-confirm:hover{background:#b91c1c}
@media print{
  @page{size:A4 portrait;margin:0}
  body{overflow:visible!important}
  #mbar,#side{display:none!important}
  #wrap{display:block!important;height:auto!important;overflow:visible!important}
  #prev{display:block!important;background:none!important;padding:0!important;overflow:visible!important;height:auto!important}
  #a4w{transform:none!important;width:auto!important;height:auto!important;margin:0!important}
  .a4{width:210mm!important;min-height:297mm!important;padding:18mm 18mm 18mm 20mm!important;box-shadow:none!important;margin:0!important;page-break-after:always;break-after:page}
  .vt{page-break-inside:avoid;break-inside:avoid}
  .dh,.vline,.lc{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div id="mbar">
  <div class="logo">GL<b>U</b>X</div>
  <button id="mtogbtn" onclick="mToggle()">미리보기 →</button>
</div>

<div id="wrap">
<div id="side">
  <div id="side-head">
    <div class="logo">GL<b>U</b>X</div>
    <p>Tour Voucher Builder</p>
  </div>

  <!-- DB 연동 배너 -->
  <div id="db-banner">
    <div class="brow">
      <div>
        <div class="binfo" id="db-info">DB 연동 모드</div>
        <div class="bsub" id="db-sub"></div>
      </div>
      <span id="db-mode-badge">DB 연동</span>
    </div>
  </div>

  <div id="savebar">
    <span>💾 자동저장</span>
    <span id="savetime" style="color:#6b7280"></span>
    <button onclick="save();toast('✅ 저장 완료!')" style="background:#166534;color:#fff;border:none;border-radius:4px;padding:2px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif">저장</button>
  </div>
  <div id="tabs">
    <button class="tb on" onclick="stab(this,'s1')">예약정보</button>
    <button class="tb" onclick="stab(this,'s2')">서비스</button>
    <button class="tb" onclick="stab(this,'s3')">일정</button>
    <button class="tb" onclick="stab(this,'s4')">안내사항</button>
  </div>
  <div id="fscroll">

    <div class="sec on" id="s1">
      <div class="stit">RESERVATION</div>
      <div class="r2">
        <div class="f"><label>예약 채널</label><input id="rch" value="" oninput="ri()"></div>
        <div class="f"><label>예약 번호</label><input id="rno" value="" oninput="ri()"></div>
      </div>
      <div class="r2">
        <div class="f"><label>예약자 성함</label><input id="rnm" value="" oninput="ri()"></div>
        <div class="f"><label>인원 수</label><input id="rpp" value="" oninput="ri()"></div>
      </div>
      <div class="r2">
        <div class="f"><label>연락처</label><input id="rct" value="" oninput="ri()"></div>
        <div class="f">
          <label>여행 날짜</label>
          <input id="rdt" value="" placeholder="📅 클릭하여 날짜 선택" readonly
            onclick="openCalModal()" class="date-input-btn">
        </div>
      </div>
    </div>

    <div class="sec" id="s2">
      <div class="stit">INFORMATION</div>
      <div class="r2">
        <div class="f"><label>차량</label><input id="scar" value="토요타 알파드 (8인승)" oninput="ri()"></div>
        <div class="f"><label>잔금(현장결제)</label><input id="sbal" value="5,000엔" oninput="ri()"></div>
      </div>
      <div class="f"><label>잔금 비고</label><input id="sbnt" value="(현장에서 가이드님께 결제)" oninput="ri()"></div>
      <div class="f"><label>포함 내역 (줄바꿈 구분)</label>
        <textarea id="sinc" oninput="ri()" style="min-height:160px">· 운전/여행 가이드님
· 차량 &amp; 차량실비
  - 토요타 알파드 8인승
  - 주유비, 톨비, 주차비 등
· 픽업/드랍 서비스
· 스냅 사진촬영</textarea></div>
      <div class="f"><label>불포함 내역 (줄바꿈 구분)</label>
        <textarea id="sexc" oninput="ri()" style="min-height:160px">· 항공권 &amp; 숙소
· 현장 개인 지출 비용
· 점심 식사비(가이드님분 포함)
· 관광지 입장료
· 간식, 쇼핑 등</textarea></div>
      <div class="f"><label>여행자 요청사항</label>
        <textarea id="sreq" oninput="ri()" style="min-height:120px"></textarea></div>
    </div>

    <div class="sec" id="s3">
      <div class="stit">일정 관리</div>
      <div id="dwrap"></div>
      <button class="badd" onclick="addDay()">+ 날짜 추가</button>
    </div>

    <div class="sec" id="s4">
      <div class="stit">안내사항</div>
      <div id="nwrap"></div>
      <button class="badd" onclick="addNote()">+ 안내사항 추가</button>
    </div>

  </div>
  <div id="acts">
    <button class="act ap" onclick="doPrint()">🖨️ PDF</button>
    <button class="act as" onclick="dlWord()">📄 Word</button>
    <button class="act ab" id="save-db-btn" onclick="saveToAPI()" style="display:none">💾 DB 저장</button>
    <button class="act ae" id="send-email-btn" onclick="sendEmail()" style="display:none">✉️ 이메일</button>
    <button class="act ar" onclick="resetAll()">🗑️</button>
  </div>
</div>

<div id="prev">
  <div id="a4w">
    <div id="vout"></div>
  </div>
</div>
</div>
<div id="toast"></div>

<div id="cal-modal">
  <div id="cal-overlay" onclick="closeCalModal()"></div>
  <div id="cal-popup">
    <div id="cal-popup-title">
      여행 날짜 선택
      <span id="cal-step-hint" style="font-size:11px;color:#D9251C;font-weight:600">시작일을 클릭하세요</span>
    </div>
    <div class="tbns" style="margin-bottom:10px">
      <button class="tbn" data-n="1" onclick="setNightsShortcut(1,this)">1박2일</button>
      <button class="tbn" data-n="2" onclick="setNightsShortcut(2,this)">2박3일</button>
      <button class="tbn" data-n="3" onclick="setNightsShortcut(3,this)">3박4일</button>
      <button class="tbn" data-n="4" onclick="setNightsShortcut(4,this)">4박5일</button>
      <button class="tbn" data-n="5" onclick="setNightsShortcut(5,this)">5박6일</button>
    </div>
    <div class="cw" style="margin-bottom:6px">
      <div class="ch">
        <button class="cn" onclick="calPrev()">◀</button>
        <span id="caltitle"></span>
        <button class="cn" onclick="calNext()">▶</button>
      </div>
      <div class="cg" id="calgrid"></div>
    </div>
    <div id="selinfo"></div>
    <button id="cal-confirm" onclick="closeCalModal()">확인</button>
  </div>
</div>

<script>
// ============================================================
// DB 연동 상태
// ============================================================
const urlParams = new URLSearchParams(window.location.search)
const APP_ID = urlParams.get('appId')
let currentApp = null

// ============================================================
// 전역 상태
// ============================================================
const FIELDS = ['rch','rno','rnm','rpp','rct','rdt','scar','sbal','sbnt','sinc','sexc','sreq']
const SK = APP_ID ? `glux_v2_app_${APP_ID}` : 'glux_v2'
let nights = 1
let startDt = null
let endDt = null
let calStep = 0
let calY = new Date().getFullYear()
let calM = new Date().getMonth()
let days = []
let notes = [
  '여행 떠나기 하루 전, 담당 가이드님께서 카카오톡을 통해 연락드릴 예정입니다. (카카오톡 친구 추가 허용을 꼭 켜주시기 바랍니다.)',
  '여행 당일 출발 시간에 맞춰 픽업 장소로 모시러 갈 예정이오니 실시간 카카오톡을 통해 소통하시면서 만나시면 됩니다.',
  '점심식사는 자유식입니다. 여행당일 담당 가이드님께서 식사취향을 고려하여 드실만한 곳을 추천 드릴 예정입니다.',
  '일일 투어 기본 이용 시간은 9시간 30분입니다. 초과 시 1시간당 5,000엔의 추가비용이 발생합니다.',
  '점심 식사비(가이드님분 포함), 관광지 입장료, 간식, 쇼핑 등 현장 개인 지출 비용은 현장에서 직접 결제해주시길 바랍니다.',
]

const $ = id => document.getElementById(id)
const gv = id => { const e=$(id); return e ? e.value : '' }
const DOW = ['일','월','화','수','목','금','토']
const fmt = d => `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일(${DOW[d.getDay()]})`

function toast(msg) {
  const t = $('toast')
  t.textContent = msg; t.style.opacity = '1'
  clearTimeout(t._t)
  t._t = setTimeout(() => t.style.opacity = '0', 2200)
}

// ============================================================
// DB 연동 기능
// ============================================================
async function loadFromAPI() {
  if (!APP_ID) return

  try {
    const r = await fetch(`/api/applications/${APP_ID}`)
    if (!r.ok) { toast('❌ 신청 데이터를 불러오지 못했습니다.'); return }
    currentApp = await r.json()

    // 배너 표시
    $('db-banner').style.display = 'block'
    $('db-info').textContent = `${currentApp.name} (${currentApp.package_type})`
    $('db-sub').textContent = `${currentApp.departure_date} ~ ${currentApp.return_date} | ${currentApp.passengers}명 | ${currentApp.reservation_no}`
    $('save-db-btn').style.display = ''
    $('send-email-btn').style.display = currentApp.email ? '' : 'none'

    // 폼 자동 채우기
    const setVal = (id, val) => { const e=$(id); if(e) e.value = val || '' }
    setVal('rch', currentApp.channel || '홈페이지')
    setVal('rno', currentApp.reservation_no)
    setVal('rnm', currentApp.name)
    setVal('rpp', currentApp.passengers + '명')
    setVal('rct', currentApp.phone)
    setVal('sreq', currentApp.requests || '')

    // 날짜 설정
    if (currentApp.departure_date && currentApp.return_date) {
      const dep = new Date(currentApp.departure_date)
      const ret = new Date(currentApp.return_date)
      dep.setHours(0,0,0,0); ret.setHours(0,0,0,0)
      startDt = dep; endDt = ret
      nights = Math.round((ret - dep) / 86400000)
      $('rdt').value = fmt(dep) + ' ~ ' + fmt(ret)
      $('rdt').classList.add('filled')
      calY = dep.getFullYear(); calM = dep.getMonth()
    }

    // 바우처 데이터가 있으면 적용
    if (currentApp.voucher) {
      const v = currentApp.voucher
      setVal('scar', v.vehicle)
      setVal('sbal', v.balance)
      setVal('sbnt', v.balance_note)
      setVal('sinc', v.includes)
      setVal('sexc', v.excludes)
      try {
        const gn = JSON.parse(v.guide_notes || '[]')
        if (gn.length) notes = gn
      } catch {}
    }

    // 저장된 일정이 있으면 로드
    if (currentApp.itinerary && currentApp.itinerary.length > 0) {
      days = currentApp.itinerary.map(d => ({
        date: d.date_label,
        pu: { time: d.pickup_time, loc: d.pickup_loc },
        dr: { time: d.dropoff_time, loc: d.dropoff_loc },
        schedule: d.schedule,
        note: d.note
      }))
    } else if (startDt) {
      genDays()
    }

    render()
    toast(`✅ ${currentApp.name}님 신청 데이터 로드 완료`)
  } catch (err) {
    toast('❌ 데이터 로드 오류: ' + err.message)
  }
}

async function saveToAPI() {
  if (!APP_ID) { toast('❌ DB 연동 모드가 아닙니다.'); return }
  const btn = $('save-db-btn')
  btn.textContent = '저장 중...'
  btn.disabled = true

  try {
    // 일정 저장
    const r1 = await fetch(`/api/applications/${APP_ID}/itinerary`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ days })
    })
    if (!r1.ok) throw new Error('일정 저장 실패')

    // 바우처 저장
    const r2 = await fetch('/api/vouchers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        application_id: parseInt(APP_ID),
        vehicle: gv('scar'),
        balance: gv('sbal'),
        balance_note: gv('sbnt'),
        includes: gv('sinc'),
        excludes: gv('sexc'),
        guide_notes: notes
      })
    })
    if (!r2.ok) throw new Error('바우처 저장 실패')

    save() // localStorage도 동기화
    toast('✅ DB에 저장되었습니다!')
  } catch (err) {
    toast('❌ ' + err.message)
  } finally {
    btn.textContent = '💾 DB 저장'
    btn.disabled = false
  }
}

async function sendEmail() {
  if (!APP_ID) return
  if (!confirm('고객에게 바우처 이메일을 발송하시겠습니까?')) return

  const btn = $('send-email-btn')
  btn.textContent = '발송 중...'
  btn.disabled = true

  try {
    // 먼저 DB에 저장
    await saveToAPI()

    const r = await fetch(`/api/vouchers/${APP_ID}/send`, { method: 'POST' })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error)
    toast('✉️ 이메일이 발송되었습니다!')
  } catch (err) {
    alert('이메일 발송 실패: ' + err.message)
  } finally {
    btn.textContent = '✉️ 이메일'
    btn.disabled = false
  }
}

// ============================================================
// 자동저장 (localStorage)
// ============================================================
let _st = null
function ri() {
  render()
  clearTimeout(_st)
  _st = setTimeout(save, 100)
}

function save() {
  try {
    const d = { fields:{}, days, notes, nights, startDt: startDt ? startDt.toISOString() : null }
    FIELDS.forEach(id => { const e=$(id); if(e) d.fields[id]=e.value })
    localStorage.setItem(SK, JSON.stringify(d))
    const t = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})
    $('savetime').textContent = t + ' 저장됨'
  } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(SK)
    if (!raw) return false
    const d = JSON.parse(raw)
    if (d.fields) FIELDS.forEach(id => { const e=$(id); if(e&&d.fields[id]!==undefined) e.value=d.fields[id] })
    if (d.days && d.days.length) {
      days = d.days.map(day => {
        if (day.schedule === undefined) day.schedule = ''
        if (!day.pu) day.pu = {time:'',loc:''}
        if (!day.dr) day.dr = {time:'',loc:''}
        return day
      })
    }
    if (d.notes && d.notes.length) notes = d.notes
    if (d.nights) nights = d.nights
    if (d.startDt) { startDt = new Date(d.startDt); startDt.setHours(0,0,0,0) }
    if (startDt && nights) { endDt = new Date(startDt.getTime() + nights*86400000); endDt.setHours(0,0,0,0) }
    return true
  } catch(e) { return false }
}

function resetAll() {
  if (!confirm('저장된 데이터를 모두 지우고 초기화할까요?')) return
  localStorage.removeItem(SK)
  location.reload()
}

function openCalModal() {
  calStep = 0
  $('cal-step-hint').textContent = startDt ? '시작일 또는 종료일을 클릭하세요' : '시작일을 클릭하세요'
  $('cal-modal').style.display = 'block'
  buildCal()
  document.querySelectorAll('#cal-modal .tbn').forEach(b => {
    b.classList.toggle('on', parseInt(b.dataset.n) === nights)
  })
}
function closeCalModal() { $('cal-modal').style.display = 'none' }

function calPrev() { calM--; if(calM<0){calM=11;calY--;} buildCal() }
function calNext() { calM++; if(calM>11){calM=0;calY++;} buildCal() }

function buildCal() {
  $('caltitle').textContent = calY+'년 '+(calM+1)+'월'
  const g = $('calgrid'); g.innerHTML = ''
  DOW.forEach((d,i) => {
    const el = document.createElement('div')
    el.className = 'cdn'+(i===0?' sun':i===6?' sat':'')
    el.textContent = d; g.appendChild(el)
  })
  const firstDow = new Date(calY,calM,1).getDay()
  const lastDay = new Date(calY,calM+1,0).getDate()
  const today = new Date(); today.setHours(0,0,0,0)
  for(let i=0;i<firstDow;i++){const el=document.createElement('button');el.className='cd';el.disabled=true;el.textContent='';g.appendChild(el)}
  for(let dd=1;dd<=lastDay;dd++){
    const dt = new Date(calY,calM,dd); const dow = dt.getDay()
    const el = document.createElement('button'); el.textContent=dd
    let cls='cd'
    if(dow===0)cls+=' sun';else if(dow===6)cls+=' sat'
    if(dt.getTime()===today.getTime())cls+=' today'
    if(startDt&&dt.getTime()===startDt.getTime())cls+=' sel'
    else if(endDt&&dt.getTime()===endDt.getTime())cls+=' sel'
    else if(startDt&&endDt&&dt>startDt&&dt<endDt)cls+=' inr'
    el.className=cls; el.onclick=()=>pickDate(new Date(calY,calM,dd)); g.appendChild(el)
  }
}

function pickDate(dt) {
  const d = new Date(dt); d.setHours(0,0,0,0)
  if(calStep===0){
    startDt=d; endDt=null; calStep=1
    $('cal-step-hint').textContent='종료일을 클릭하세요'; buildCal()
  }else{
    if(d<=startDt){startDt=d;endDt=null;$('cal-step-hint').textContent='종료일을 클릭하세요';buildCal();return}
    endDt=d; calStep=0
    nights=Math.round((endDt-startDt)/86400000)
    $('rdt').value=fmt(startDt)+' ~ '+fmt(endDt); $('rdt').classList.add('filled')
    const si=$('selinfo'); si.style.display='block'
    si.textContent='📅 '+fmt(startDt)+' ~ '+fmt(endDt)+' ('+nights+'박'+(nights+1)+'일)'
    document.querySelectorAll('#cal-modal .tbn').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.n)===nights))
    genDays(); buildCal(); ri()
    setTimeout(closeCalModal,600)
  }
}

function setNightsShortcut(n,btn){
  nights=n
  document.querySelectorAll('#cal-modal .tbn').forEach(b=>b.classList.remove('on'))
  btn.classList.add('on')
  if(startDt){
    endDt=new Date(startDt.getTime()+n*86400000); calStep=0
    $('rdt').value=fmt(startDt)+' ~ '+fmt(endDt); $('rdt').classList.add('filled')
    const si=$('selinfo'); si.style.display='block'
    si.textContent='📅 '+fmt(startDt)+' ~ '+fmt(endDt)+' ('+nights+'박'+(nights+1)+'일)'
    genDays(); buildCal(); ri()
    setTimeout(closeCalModal,400)
  }
}

function genDays() {
  days = []
  for(let i=0;i<=nights;i++){
    const d = new Date(startDt.getTime()+i*86400000)
    days.push({date:d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')',pu:{time:'09:00',loc:''},dr:{time:'18:00',loc:''},schedule:'',note:''})
  }
  if($('s3').classList.contains('on')) buildDays()
}

  days.forEach((d,di)=>{
    const c=document.createElement('div'); c.className='dc'
    c.innerHTML=`
      <div class="dch">
        <span class="dct" onclick="scrollToDay(${di})" style="cursor:pointer">📅 ${di+1}일차 — ${d.date}</span>
        <button class="bdd" onclick="delDay(${di})">삭제</button>
      </div>
      <div class="f"><label>날짜</label><input value="${d.date}" oninput="days[${di}].date=this.value;ri()"></div>
      <div class="r2">
        <div class="f"><label>픽업 시간</label><input value="${d.pu.time||''}" oninput="days[${di}].pu.time=this.value;ri()" placeholder="09:00"></div>
        <div class="f"><label>픽업 장소</label><input value="${d.pu.loc||''}" oninput="days[${di}].pu.loc=this.value;ri()" placeholder="호텔명/주소"></div>
      </div>
      <div class="r2">
        <div class="f"><label>드랍 시간</label><input value="${d.dr.time||''}" oninput="days[${di}].dr.time=this.value;ri()" placeholder="18:00"></div>
        <div class="f"><label>드랍 장소</label><input value="${d.dr.loc||''}" oninput="days[${di}].dr.loc=this.value;ri()" placeholder="호텔명/주소"></div>
      </div>
      <div class="f">
        <label>스케줄</label>
        <table id="sct${di}" style="width:100%;border-collapse:collapse;margin-bottom:6px">
          <thead><tr>
            <th style="width:75px;text-align:center;font-size:11px;padding:5px 4px;background:#f3f4f6;border:1px solid #e5e7eb;color:#374151">시간</th>
            <th style="text-align:center;font-size:11px;padding:5px 4px;background:#f3f4f6;border:1px solid #e5e7eb;color:#374151">일정 내용</th>
            <th style="width:28px;background:#f3f4f6;border:1px solid #e5e7eb"></th>
          </tr></thead>

        <button onclick="addScRow(${di})" style="width:100%;padding:5px;background:#f9fafb;border:1px dashed #d1d5db;border-radius:5px;font-size:12px;color:#6b7280;cursor:pointer">+ 행 추가</button>
      </div>
      <div class="f"><label>비고/NOTE <span style="font-weight:400;color:#9ca3af;font-size:10px">(선택)</span></label>
        <textarea id="dnt${di}" style="min-height:60px" oninput="days[${di}].note=this.value;ri()"></textarea>
      </div>`
    w.appendChild(c)
    const scLines=(d.schedule||'').split('\n').filter(l=>l.trim())
    if(scLines.length===0)scLines.push('')
    scLines.forEach(line=>{
      const m=line.match(/^(\d{1,2})\s*:\s*(\d{2})\s*:?\s*(.*)/)
      addScRow(di,m?m[1]+':'+m[2]:'',m?m[3]:line)
    })
    $('dnt'+di).value=d.note||''
  })
}

function scrollToDay(di){
  const el=document.getElementById('pday'+di),container=document.getElementById('prev')
  if(!el||!container)return
  const top=el.getBoundingClientRect().top-container.getBoundingClientRect().top+container.scrollTop
  container.scrollTo({top,behavior:'smooth'})
}

function addDay(){days.push({date:'날짜 입력',pu:{time:'09:00',loc:''},dr:{time:'18:00',loc:''},schedule:'',note:''});buildDays();ri()}
function delDay(i){if(days.length<=1){alert('최소 1일 필요');return}days.splice(i,1);buildDays();ri()}

function syncSc(di){
  const rows=document.querySelectorAll('#scb'+di+' tr')
  days[di].schedule=Array.from(rows).map(r=>{
    const ins=r.querySelectorAll('input')
    const t=ins[0].value.trim(),c=ins[1].value.trim()
    return(t||c)?(t?t+' '+c:c):''
  }).filter(l=>l).join('\n')
  ri()
}

function addScRow(di,t='',c=''){
  const tbody=$('scb'+di); const tr=document.createElement('tr')
  tr.innerHTML=`
    <td style="padding:3px 4px"><input value="${t}" placeholder="09:00" style="width:100%;padding:4px 5px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;text-align:center;box-sizing:border-box" oninput="syncSc(${di})"></td>
    <td style="padding:3px 4px"><input value="${c}" placeholder="일정 내용" style="width:100%;padding:4px 5px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;box-sizing:border-box" oninput="syncSc(${di})"></td>
    <td style="padding:3px 4px;text-align:center"><button onclick="this.closest('tr').remove();syncSc(${di})" style="background:#fee2e2;color:#D9251C;border:none;border-radius:3px;padding:2px 7px;cursor:pointer;font-size:13px;font-weight:700">×</button></td>`
  tbody.appendChild(tr)
}

function scaleA4(){
  const w=$('a4w'),p=$('prev'); if(!w||!p)return
  const A4=794,avail=p.clientWidth-24
  if(avail>0&&avail<A4){
    const sc=avail/A4; w.style.transform=`scale(${sc})`; w.style.transformOrigin='top center'
    let h=0; w.querySelectorAll('.a4').forEach(pg=>h+=pg.offsetHeight+20)
    w.style.height=h+'px'; w.style.marginBottom=(Math.ceil(h*sc)-h)+'px'
  }else{w.style.transform='';w.style.height='auto';w.style.marginBottom='0'}
}

async function dlWord(){
  function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++){c^=buf[i];for(let j=0;j<8;j++)c=(c>>>1)^(c&1?0xEDB88320:0)}return(c^0xFFFFFFFF)>>>0}

  function makeZip(entries){
    const enc=new TextEncoder();const toU8=d=>typeof d==='string'?enc.encode(d):d
    const locals=[];const cds=[];let off=0
    for(const f of entries){const nm=enc.encode(f.name),data=toU8(f.data);const crc=crc32(data),sz=data.length,nl=nm.length;const lh=new Uint8Array(30+nl+sz);lh[0]=0x50;lh[1]=0x4B;lh[2]=0x03;lh[3]=0x04;w16(lh,4,20);w32(lh,14,crc);w32(lh,18,sz);w32(lh,22,sz);w16(lh,26,nl);lh.set(nm,30);lh.set(data,30+nl);locals.push(lh);const cd=new Uint8Array(46+nl);cd[0]=0x50;cd[1]=0x4B;cd[2]=0x01;cd[3]=0x02;w16(cd,4,20);w16(cd,6,20);w32(cd,16,crc);w32(cd,20,sz);w32(cd,24,sz);w16(cd,28,nl);w32(cd,42,off);cd.set(nm,46);cds.push(cd);off+=lh.length}
    const csz=cds.reduce((s,c)=>s+c.length,0);const eocd=new Uint8Array(22);eocd[0]=0x50;eocd[1]=0x4B;eocd[2]=0x05;eocd[3]=0x06;w16(eocd,8,entries.length);w16(eocd,10,entries.length);w32(eocd,12,csz);w32(eocd,16,off);const total=off+csz+22;const out=new Uint8Array(total);let p=0;for(const l of locals){out.set(l,p);p+=l.length}for(const c of cds){out.set(c,p);p+=c.length}out.set(eocd,p);return out
  }
  const LC_BG='#F9FAFB',TH_BG='#F3F4F6'
  const LC=`background:${LC_BG};font-weight:bold;font-size:8pt;color:#374151;text-align:center;padding:5pt 6pt;border:1pt solid #D1D5DB;font-family:'맑은 고딕',sans-serif`

  const SH=t=>`<table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:6pt 0 4pt"><tr><td bgcolor="#D9251C" style="background:#D9251C;width:4pt;padding:0;font-size:1pt">&nbsp;</td><td style="font-size:10pt;font-weight:bold;font-family:'맑은 고딕',sans-serif;padding:2pt 6pt">${t}</td></tr></table>`
  const HDR=()=>`<table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-bottom:8pt"><tr><td style="width:50%;vertical-align:bottom"><span style="font-family:Arial,sans-serif;font-size:24pt;font-weight:900;color:#0f0f1a">GL</span><span style="font-family:Arial,sans-serif;font-size:24pt;font-weight:900;color:#D9251C">U</span><span style="font-family:Arial,sans-serif;font-size:24pt;font-weight:900;color:#0f0f1a">X</span></td><td style="width:50%;text-align:right;vertical-align:bottom"><span style="font-family:Arial,sans-serif;font-size:17pt;font-weight:bold;color:#0f0f1a">TOUR </span><span style="font-family:Arial,sans-serif;font-size:17pt;font-weight:bold;color:#D9251C">VOUCHER</span><br><span style="font-size:7.5pt;color:#6b7280;font-family:'맑은 고딕',sans-serif">저희 GLUX 투어를 예약해 주셔서 진심으로 감사드립니다.</span></td></tr></table><table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:0 0 10pt 0"><tr><td bgcolor="#0f0f1a" style="background:#0f0f1a;height:5pt;font-size:1pt;line-height:5pt">&nbsp;</td></tr></table>`
  const inclL=gv('sinc').split('\n').filter(l=>l.trim()).map(l=>`<tr><td style="padding:2pt 6pt;font-size:9pt;font-family:'맑은 고딕',sans-serif">${l}</td></tr>`).join('')
  const exclL=gv('sexc').split('\n').filter(l=>l.trim()).map(l=>`<tr><td style="padding:2pt 6pt;font-size:9pt;font-family:'맑은 고딕',sans-serif">${l}</td></tr>`).join('')

    dayHtml+=`<br clear="all" style="mso-special-character:line-break;page-break-before:always">${HDR()}<table width="100%" border="0" bgcolor="#0f0f1a" style="background:#0f0f1a;border-collapse:collapse;margin-bottom:8pt"><tr><td bgcolor="#0f0f1a" style="background:#0f0f1a;padding:6pt 10pt;font-size:12pt;font-weight:bold;color:#fff;font-family:'맑은 고딕',sans-serif">&#9632; <span style="color:#D9251C">${di+1}일차 — ${d.date}</span></td></tr></table>${SH('PICK UP / DROP')}<table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-bottom:8pt"><tr><td bgcolor="${TH_BG}" style="${TH};width:70pt"></td><td bgcolor="${TH_BG}" style="${TH};width:60pt">시간</td><td bgcolor="${TH_BG}" style="${TH}">장소</td></tr><tr><td bgcolor="${LC_BG}" style="${LC}">픽업</td><td style="${VC};text-align:center">${d.pu.time||''}</td><td style="${VC}">${d.pu.loc||''}</td></tr><tr><td bgcolor="${LC_BG}" style="${LC}">드랍</td><td style="${VC};text-align:center">${d.dr.time||''}</td><td style="${VC}">${d.dr.loc||''}</td></tr></table>${SH('SCHEDULE')}<table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-bottom:8pt"><tr><td bgcolor="${TH_BG}" style="${TH};width:50pt">시간</td><td bgcolor="${TH_BG}" style="${TH}">일정 내용</td></tr>${schR}</table>${d.note?SH('NOTE')+'<table width="100%"><tr><td style="'+VC+';vertical-align:top">'+d.note.replace(/\n/g,'<br>')+'</td></tr></table>':''}`
  })
  const html=`<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>@page{size:210mm 297mm;margin:18mm 18mm 18mm 20mm;}@page Section1{size:210mm 297mm;margin:18mm 18mm 18mm 20mm;}div.Section1{page:Section1;}body{font-family:'맑은 고딕',sans-serif;font-size:10pt;margin:0;padding:0;}table{border-collapse:collapse;width:100%;}p{margin:0;padding:0;}td{mso-number-format:"\\@";}</style></head><body><div class="Section1">${HDR()}${SH('RESERVATION')}<table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-bottom:8pt"><tr><td bgcolor="${LC_BG}" style="${LC}">예약 채널</td><td style="${VC}">${gv('rch')}</td><td bgcolor="${LC_BG}" style="${LC}">예약 번호</td><td style="${VC}">${gv('rno')}</td></tr><tr><td bgcolor="${LC_BG}" style="${LC}">예약자 성함</td><td style="${VC}">${gv('rnm')}</td><td bgcolor="${LC_BG}" style="${LC}">여행 날짜</td><td style="${VC}">${gv('rdt')}</td></tr><tr><td bgcolor="${LC_BG}" style="${LC}">예약자 연락처</td><td style="${VC}">${gv('rct')}</td><td bgcolor="${LC_BG}" style="${LC}">인원 수</td><td style="${VC}">${gv('rpp')}</td></tr></table>${SH('INFORMATION')}<table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-bottom:8pt"><tr><td bgcolor="${LC_BG}" style="${LC}">차량</td><td style="${VC}">${gv('scar')}</td><td bgcolor="${LC_BG}" style="${LC}">잔금(현장결제)</td><td style="${VC};text-align:center"><b style="font-size:12pt">${gv('sbal')}</b><br><span style="font-size:7.5pt;color:#6b7280">${gv('sbnt')}</span></td></tr><tr><td bgcolor="${LC_BG}" style="${LC};vertical-align:top">포함 내역</td><td style="${VC};vertical-align:top"><table border="0" style="border:none">${inclL}</table></td><td bgcolor="${LC_BG}" style="${LC};vertical-align:top">불포함 내역</td><td style="${VC};vertical-align:top"><table border="0" style="border:none">${exclL}</table></td></tr><tr><td bgcolor="${LC_BG}" style="${LC};vertical-align:top">여행자 요청사항</td><td colspan="3" style="${VC};vertical-align:top">${sreq}</td></tr></table>${noteH?`<table width="100%" border="0" bgcolor="#fafafa" cellpadding="0" cellspacing="0" style="border-collapse:collapse"><tr><td bgcolor="#fafafa" style="background:#fafafa;border-top:1pt solid #e5e7eb;padding:8pt 10pt">${noteH}</td></tr></table>`:''}${dayHtml}</div></body></html>`
  const DOCX_MIME='application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="htm" ContentType="text/html"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`
  const wordRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="chunk1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/aFChunk" Target="afchunk.htm"/></Relationships>`
  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:altChunk r:id="chunk1"/><w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1020" w:right="1020" w:bottom="1020" w:left="1134" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`
  const stylesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="맑은 고딕" w:hAnsi="맑은 고딕" w:cs="맑은 고딕"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>`
  const zipData=makeZip([{name:'[Content_Types].xml',data:contentTypes},{name:'_rels/.rels',data:rootRels},{name:'word/document.xml',data:docXml},{name:'word/_rels/document.xml.rels',data:wordRels},{name:'word/styles.xml',data:stylesXml},{name:'word/afchunk.htm',data:html}])
  const blob=new Blob([zipData],{type:DOCX_MIME})

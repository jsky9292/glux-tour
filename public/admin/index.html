<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLUX Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;height:100vh;height:100dvh;overflow:hidden}
#wrap{display:flex;height:100vh;height:100dvh}

/* 왼쪽 패널 */
#left{width:360px;min-width:360px;background:#fff;display:flex;flex-direction:column;border-right:1px solid #e5e7eb}
#left-head{background:#0f0f1a;padding:14px 16px;flex-shrink:0}
#left-head .logo{font-family:Arial,sans-serif;font-size:17px;font-weight:900;letter-spacing:3px;color:#fff}
#left-head .logo b{color:#D9251C}
#left-head p{font-size:10px;color:#6b7280;margin-top:2px}

/* 통계 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px;border-bottom:1px solid #f3f4f6;flex-shrink:0}
.stat{background:#f9fafb;border-radius:7px;padding:8px 10px;text-align:center}
.stat .n{font-size:20px;font-weight:800;color:#0f0f1a}
.stat .l{font-size:9px;color:#9ca3af;font-weight:500}
.stat.red .n{color:#D9251C}
.stat.green .n{color:#166534}
.stat.blue .n{color:#1d4ed8}

/* 필터/검색 */
.toolbar{padding:10px 12px;border-bottom:1px solid #f3f4f6;flex-shrink:0}
.filter-row{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.ftab{padding:5px 12px;border-radius:16px;border:1.5px solid #e5e7eb;background:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:#6b7280;transition:all .15s}
.ftab.on{border-color:#D9251C;background:#D9251C;color:#fff}
.search-inp{width:100%;padding:8px 11px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none}
.search-inp:focus{border-color:#D9251C}

/* 신청 목록 */
#app-list{flex:1;overflow-y:auto}
#app-list::-webkit-scrollbar{width:4px}
#app-list::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:2px}
.app-card{padding:12px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .1s}
.app-card:hover{background:#fafafa}
.app-card.active{background:#fff5f5;border-left:3px solid #D9251C}
.app-card:not(.active){border-left:3px solid transparent}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card-name{font-size:13px;font-weight:700;color:#1a1a2e}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.card-right{display:flex;align-items:center;gap:6px}
.card-del{border:none;background:transparent;cursor:pointer;font-size:13px;line-height:1;padding:3px 5px;border-radius:6px;opacity:.5;transition:opacity .1s,background .1s}
.card-del:hover{opacity:1;background:#fee2e2}
.b-pending{background:#fef3c7;color:#92400e}
.b-confirmed{background:#d1fae5;color:#065f46}
.b-voucher_sent{background:#dbeafe;color:#1e40af}
.b-completed{background:#f3f4f6;color:#374151}
.card-info{font-size:11px;color:#6b7280;line-height:1.6}
.card-rno{font-size:10px;color:#D9251C;font-weight:700;margin-top:3px}

/* 빈 상태 */
.empty{text-align:center;padding:40px 20px;color:#9ca3af}
.loading{text-align:center;padding:30px;color:#9ca3af;font-size:12px}

/* 좌측 하단 버튼 */
.left-footer{padding:10px 12px;border-top:1px solid #f3f4f6;display:flex;gap:6px;flex-shrink:0}
.btn{padding:7px 14px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.btn-red{background:#D9251C;color:#fff}
.btn-gray{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}
.btn:hover{opacity:.85}

/* 오른쪽 패널 */
#right{flex:1;display:flex;flex-direction:column;background:#f0f2f5;min-height:0}
#right-head{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:48px}
#right-title{font-size:13px;font-weight:700;color:#374151}
#right-actions{display:flex;gap:6px}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-green{background:#166534;color:#fff}
.btn-dark{background:#0f0f1a;color:#fff}

#voucher-frame{flex:1;border:none;width:100%;height:100%;min-height:0;background:#fff}

#placeholder{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#9ca3af}
#placeholder .icon{font-size:48px}
#placeholder p{font-size:14px}
#placeholder small{font-size:12px;color:#d1d5db}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f0f1a;color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">

<!-- 왼쪽: 신청 목록 -->
<div id="left">
  <div id="left-head">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="logo">GL<b>U</b>X</div>
      <a href="/api/admin/logout" style="font-size:10px;color:#6b7280;text-decoration:none;background:#1a1a2e;padding:4px 10px;border-radius:12px;border:1px solid #374151">로그아웃</a>
    </div>
    <p>Admin — 신청 관리</p>
  </div>

  <div class="stats">
    <div class="stat red"><div class="n" id="s-pending">—</div><div class="l">대기</div></div>
    <div class="stat green"><div class="n" id="s-confirmed">—</div><div class="l">확정</div></div>
    <div class="stat blue"><div class="n" id="s-sent">—</div><div class="l">발송</div></div>
  </div>

  <div class="toolbar">
    <div class="filter-row">
      <button class="ftab on" onclick="filterBy('',this)">전체</button>
      <button class="ftab" onclick="filterBy('pending',this)">대기</button>
      <button class="ftab" onclick="filterBy('confirmed',this)">확정</button>
      <button class="ftab" onclick="filterBy('voucher_sent',this)">발송</button>
      <button class="ftab" onclick="filterBy('completed',this)">완료</button>
    </div>
    <input class="search-inp" type="text" id="search-inp" placeholder="이름·연락처·예약번호 검색" oninput="applySearch()">
  </div>

  <div id="app-list"><div class="loading">불러오는 중...</div></div>

  <div class="left-footer">
    <button class="btn btn-red" onclick="loadApps()" style="flex:1">🔄 새로고침</button>
    <a class="btn btn-gray" href="/admin/quote" target="_blank">📄 고객 견적서</a>
    <a class="btn btn-gray" href="/admin/estimate" target="_blank">🧾 내부 원가명세</a>
    <a class="btn btn-gray" href="/" target="_blank">🌐 고객사이트</a>
  </div>
</div>

<!-- 오른쪽: 바우처 빌더 -->
<div id="right">
  <div id="right-head">
    <div id="right-title">← 왼쪽에서 신청을 선택하세요</div>
    <div id="right-actions" style="display:none">
      <button class="btn btn-gray btn-sm" onclick="updateStatus('confirmed')">✅ 확정</button>
      <button class="btn btn-green btn-sm" id="email-btn" onclick="sendEmail()">✉️ 이메일 발송</button>
      <button class="btn btn-gray btn-sm" style="color:#D9251C" onclick="deleteApp()">🗑️ 삭제</button>
    </div>
  </div>

  <iframe id="voucher-frame" src="/admin/voucher" onload="onFrameLoad()"></iframe>
</div>

</div>
<div id="toast"></div>

<script>
let allApps = []
let currentFilter = ''
let selectedId = null

const STATUS = {
  pending:{label:'대기',cls:'b-pending'},
  confirmed:{label:'확정',cls:'b-confirmed'},
  voucher_sent:{label:'발송',cls:'b-voucher_sent'},
  completed:{label:'완료',cls:'b-completed'}
}

function toast(msg){
  const t=document.getElementById('toast')
  t.textContent=msg;t.style.opacity='1'
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2500)
}

async function loadStats(){
  try{
    const r=await fetch('/api/applications/stats')
    const d=await r.json()
    document.getElementById('s-pending').textContent=d.pending
    document.getElementById('s-confirmed').textContent=d.confirmed
    document.getElementById('s-sent').textContent=d.sent
  }catch{}
}

async function loadApps(){
  document.getElementById('app-list').innerHTML='<div class="loading">불러오는 중...</div>'
  try{
    const r=await fetch('/api/applications')
    allApps=await r.json()
    loadStats()
    renderList(allApps)
  }catch{
    document.getElementById('app-list').innerHTML='<div class="empty">⚠️ 서버 연결 실패</div>'
  }
}

function filterBy(status,btn){
  currentFilter=status
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'))
  btn.classList.add('on')
  applySearch()
}

function applySearch(){
  const q=document.getElementById('search-inp').value.toLowerCase()
  let list=currentFilter?allApps.filter(a=>a.status===currentFilter):allApps
  if(q)list=list.filter(a=>(a.name||'').toLowerCase().includes(q)||(a.phone||'').includes(q)||(a.reservation_no||'').toLowerCase().includes(q))
  renderList(list)
}

function renderList(apps){
  if(!apps.length){document.getElementById('app-list').innerHTML='<div class="empty">📭 신청이 없습니다</div>';return}
  document.getElementById('app-list').innerHTML=apps.map(a=>{
    const st=STATUS[a.status]||{label:a.status,cls:''}
    return `<div class="app-card${a.id===selectedId?' active':''}" onclick="selectApp(${a.id})">
      <div class="card-top">
        <span class="card-name">${a.name} <span style="font-weight:400;color:#6b7280">${a.passengers}명</span></span>
        <span class="card-right">
          <span class="badge ${st.cls}">${st.label}</span>
          <button class="card-del" onclick="delFromList(event,${a.id})" title="신청 삭제">🗑️</button>
        </span>
      </div>
      <div class="card-info">${a.phone} · ${a.departure_date}~${a.return_date}<br>${a.package_type}${a.has_voucher?' <span style="color:#D9251C;font-weight:700">·바우처✓</span>':''}</div>
      <div class="card-rno">${a.reservation_no||''}</div>
    </div>`
  }).join('')
}

function selectApp(id){
  selectedId=id
  document.querySelectorAll('.app-card').forEach(c=>{
    const cid=parseInt(c.getAttribute('onclick').match(/\d+/)[0])
    c.classList.toggle('active',cid===id)
  })
  const app=allApps.find(a=>a.id===id)
  if(!app)return
  const st=STATUS[app.status]||{label:app.status,cls:''}
  document.getElementById('right-title').innerHTML=`<span class="badge ${st.cls}">${st.label}</span> &nbsp; <strong>${app.name}</strong> &nbsp; <span style="font-weight:400;color:#6b7280">${app.reservation_no||''}</span>`
  document.getElementById('right-actions').style.display='flex'
  document.getElementById('voucher-frame').src=`/admin/voucher?appId=${id}`
}

function onFrameLoad(){
  // iframe 로드 후 저장 시 목록 갱신
}

async function updateStatus(status){
  if(!selectedId)return
  await fetch(`/api/applications/${selectedId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})})
  toast('✅ 상태 업데이트됨')
  await loadApps()
  // 선택 유지
  document.querySelectorAll('.app-card').forEach(c=>{
    const cid=parseInt(c.getAttribute('onclick').match(/\d+/)[0])
    c.classList.toggle('active',cid===selectedId)
  })
}

async function sendEmail(){
  if(!selectedId)return
  const btn=document.getElementById('email-btn')
  btn.disabled=true;btn.textContent='발송 중...'
  try{
    const r=await fetch(`/api/vouchers/${selectedId}/send`,{method:'POST'})
    const d=await r.json()
    if(!r.ok)throw new Error(d.error)
    toast('✉️ 이메일 발송 완료!')
    loadApps()
  }catch(err){
    alert('발송 실패: '+err.message)
  }finally{
    btn.disabled=false;btn.textContent='✉️ 이메일 발송'
  }
}

async function deleteApp(){
  if(!selectedId||!confirm('이 신청을 삭제하시겠습니까?'))return
  await fetch(`/api/applications/${selectedId}`,{method:'DELETE'})
  toast('🗑️ 삭제됨')
  selectedId=null
  document.getElementById('right-title').textContent='← 왼쪽에서 신청을 선택하세요'
  document.getElementById('right-actions').style.display='none'
  document.getElementById('voucher-frame').src='/admin/voucher'
  loadApps()
}

async function delFromList(e,id){
  e.stopPropagation()
  const app=allApps.find(a=>a.id===id)
  if(!confirm(`'${app?app.name:''}' 신청을 삭제하시겠습니까?`))return
  await fetch(`/api/applications/${id}`,{method:'DELETE'})
  toast('🗑️ 삭제됨')
  if(selectedId===id){
    selectedId=null
    document.getElementById('right-title').textContent='← 왼쪽에서 신청을 선택하세요'
    document.getElementById('right-actions').style.display='none'
    document.getElementById('voucher-frame').src='/admin/voucher'
  }
  loadApps()
}

loadApps()
</script>
</body>
</html>

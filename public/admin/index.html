<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLUX Tour — 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e}

/* 레이아웃 */
#wrap{display:flex;height:100vh}
#side{width:220px;min-width:220px;background:#0f0f1a;display:flex;flex-direction:column;overflow-y:auto}
#main{flex:1;overflow-y:auto;padding:24px}

/* 사이드바 */
.s-logo{padding:20px 18px 16px;border-bottom:1px solid #1f1f30}
.s-logo .logo{font-family:Arial,sans-serif;font-size:18px;font-weight:900;letter-spacing:3px;color:#fff}
.s-logo .logo b{color:#D9251C}
.s-logo p{font-size:10px;color:#4b5563;margin-top:3px}
.s-nav{padding:16px 10px;flex:1}
.s-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#9ca3af;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;margin-bottom:4px;transition:all .15s}
.s-item:hover,.s-item.on{background:#1f1f30;color:#fff}
.s-item.on{color:#D9251C}
.s-footer{padding:14px 16px;border-top:1px solid #1f1f30;font-size:11px;color:#4b5563}
.s-footer a{color:#6b7280;text-decoration:none}

/* 상단 */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.top-bar h1{font-size:20px;font-weight:700}
.btn{padding:8px 16px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn-red{background:#D9251C;color:#fff}
.btn-dark{background:#0f0f1a;color:#fff}
.btn-gray{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}
.btn-green{background:#166534;color:#fff}
.btn-sm{padding:5px 12px;font-size:11px}
.btn:disabled{background:#d1d5db;cursor:not-allowed;color:#9ca3af}

/* 통계 카드 */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.stat{background:#fff;border-radius:10px;padding:16px 18px;border:1px solid #e5e7eb}
.stat .n{font-size:26px;font-weight:800;color:#0f0f1a;margin-bottom:3px}
.stat .l{font-size:11px;color:#6b7280;font-weight:500}
.stat.red .n{color:#D9251C}
.stat.green .n{color:#166534}
.stat.blue .n{color:#1d4ed8}

/* 필터 탭 */
.filter-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.ftab{padding:7px 16px;border-radius:20px;border:1.5px solid #e5e7eb;background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:#6b7280;transition:all .15s}
.ftab.on{border-color:#D9251C;background:#D9251C;color:#fff}

/* 검색 */
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-bar input{flex:1;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:13px;font-family:'Noto Sans KR',sans-serif}
.search-bar input:focus{outline:none;border-color:#D9251C}

/* 테이블 */
.tbl-wrap{background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#f9fafb;padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#6b7280;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #f3f4f6;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.b-pending{background:#fef3c7;color:#92400e}
.b-confirmed{background:#d1fae5;color:#065f46}
.b-voucher_sent{background:#dbeafe;color:#1e40af}
.b-completed{background:#f3f4f6;color:#374151}
.actions{display:flex;gap:5px;flex-wrap:wrap}

/* 모달 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(620px,94vw);max-height:88vh;overflow-y:auto;padding:28px 28px}
.modal h3{font-size:17px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#9ca3af;line-height:1}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.info-item .lbl{font-size:11px;font-weight:700;color:#D9251C;letter-spacing:.5px;margin-bottom:3px}
.info-item .val{font-size:13px;color:#1a1a2e}
.sep{border:none;border-top:1px solid #e5e7eb;margin:16px 0}
.itin-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.itin-table th{background:#0f0f1a;color:#fff;padding:7px 10px;text-align:left}
.itin-table td{padding:7px 10px;border-bottom:1px solid #f3f4f6}
.itin-table tr:last-child td{border-bottom:none}
.modal-acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.status-sel{padding:7px 12px;border:1.5px solid #e5e7eb;border-radius:6px;font-size:12px;font-family:'Noto Sans KR',sans-serif}

/* 빈 상태 */
.empty{text-align:center;padding:60px 20px;color:#9ca3af}
.empty p{font-size:14px;margin-top:10px}

/* 로딩 */
.loading{text-align:center;padding:40px;color:#9ca3af;font-size:13px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f0f1a;color:#fff;padding:9px 22px;border-radius:24px;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">

<!-- 사이드바 -->
<div id="side">
  <div class="s-logo">
    <div class="logo">GL<b>U</b>X</div>
    <p>Admin Dashboard</p>
  </div>
  <nav class="s-nav">
    <a class="s-item on" onclick="setView('apps')">📋 신청 관리</a>
    <a class="s-item" href="/" target="_blank">🌐 고객 사이트</a>
    <a class="s-item" href="/admin/voucher" target="_blank">📄 바우처 빌더</a>
  </nav>
  <div class="s-footer">
    <a href="/">고객 페이지로 이동 →</a>
  </div>
</div>

<!-- 메인 -->
<div id="main">
  <div class="top-bar">
    <h1>신청 관리</h1>
    <button class="btn btn-red" onclick="loadApps()">🔄 새로고침</button>
  </div>

  <!-- 통계 -->
  <div class="stats" id="stats-wrap">
    <div class="stat"><div class="n" id="s-total">—</div><div class="l">전체 신청</div></div>
    <div class="stat red"><div class="n" id="s-pending">—</div><div class="l">대기 중</div></div>
    <div class="stat green"><div class="n" id="s-confirmed">—</div><div class="l">일정 확정</div></div>
    <div class="stat blue"><div class="n" id="s-sent">—</div><div class="l">바우처 발송</div></div>
    <div class="stat"><div class="n" id="s-completed">—</div><div class="l">완료</div></div>
  </div>

  <!-- 필터 -->
  <div class="filter-tabs">
    <button class="ftab on" onclick="filterBy('',this)">전체</button>
    <button class="ftab" onclick="filterBy('pending',this)">대기 중</button>
    <button class="ftab" onclick="filterBy('confirmed',this)">일정 확정</button>
    <button class="ftab" onclick="filterBy('voucher_sent',this)">바우처 발송</button>
    <button class="ftab" onclick="filterBy('completed',this)">완료</button>
  </div>

  <!-- 검색 -->
  <div class="search-bar">
    <input type="text" id="search-inp" placeholder="이름, 연락처, 예약번호로 검색..." oninput="applySearch()">
  </div>

  <!-- 테이블 -->
  <div class="tbl-wrap">
    <div id="tbl-content"><div class="loading">데이터를 불러오는 중...</div></div>
  </div>
</div>

</div><!-- #wrap -->
<div id="toast"></div>

<!-- 상세 모달 -->
<div class="modal-bg" id="detail-modal">
  <div class="modal">
    <h3 id="modal-title">신청 상세 <button class="modal-close" onclick="closeModal()">✕</button></h3>
    <div id="modal-body"></div>
  </div>
</div>

<script>
let allApps = []
let currentFilter = ''
let currentApp = null

const STATUS_MAP = {
  pending: { label: '대기 중', cls: 'b-pending' },
  confirmed: { label: '일정 확정', cls: 'b-confirmed' },
  voucher_sent: { label: '바우처 발송', cls: 'b-voucher_sent' },
  completed: { label: '완료', cls: 'b-completed' }
}

function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.style.opacity = '1'
  clearTimeout(t._t)
  t._t = setTimeout(() => t.style.opacity = '0', 2500)
}

async function loadStats() {
  try {
    const r = await fetch('/api/applications/stats')
    const d = await r.json()
    document.getElementById('s-total').textContent = d.total
    document.getElementById('s-pending').textContent = d.pending
    document.getElementById('s-confirmed').textContent = d.confirmed
    document.getElementById('s-sent').textContent = d.sent
    document.getElementById('s-completed').textContent = d.completed
  } catch {}
}

async function loadApps() {
  document.getElementById('tbl-content').innerHTML = '<div class="loading">불러오는 중...</div>'
  try {
    const r = await fetch('/api/applications')
    allApps = await r.json()
    loadStats()
    renderTable(allApps)
  } catch (err) {
    document.getElementById('tbl-content').innerHTML = '<div class="empty"><div style="font-size:40px">⚠️</div><p>데이터를 불러오지 못했습니다. 서버 연결을 확인하세요.</p></div>'
  }
}

function filterBy(status, btn) {
  currentFilter = status
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('on'))
  btn.classList.add('on')
  applySearch()
}

function applySearch() {
  const q = document.getElementById('search-inp').value.toLowerCase()
  let filtered = currentFilter ? allApps.filter(a => a.status === currentFilter) : allApps
  if (q) {
    filtered = filtered.filter(a =>
      (a.name||'').toLowerCase().includes(q) ||
      (a.phone||'').includes(q) ||
      (a.reservation_no||'').toLowerCase().includes(q) ||
      (a.package_type||'').includes(q)
    )
  }
  renderTable(filtered)
}

function renderTable(apps) {
  if (!apps.length) {
    document.getElementById('tbl-content').innerHTML = '<div class="empty"><div style="font-size:40px">📭</div><p>신청 내역이 없습니다.</p></div>'
    return
  }
  const rows = apps.map(a => {
    const st = STATUS_MAP[a.status] || { label: a.status, cls: '' }
    return `<tr>
      <td><strong>${a.reservation_no || '—'}</strong></td>
      <td>${a.name}</td>
      <td>${a.phone}</td>
      <td>${a.package_type}</td>
      <td>${a.departure_date} ~ ${a.return_date}</td>
      <td>${a.passengers}명</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td>
        <div class="actions">
          <button class="btn btn-gray btn-sm" onclick="openDetail(${a.id})">상세</button>
          <button class="btn btn-dark btn-sm" onclick="openVoucher(${a.id})">바우처</button>
          ${a.status !== 'completed' ? `<button class="btn btn-sm" style="background:#f0fdf4;color:#166534;border:1px solid #bbf7d0" onclick="quickStatus(${a.id},'completed')">완료✓</button>` : ''}
        </div>
      </td>
    </tr>`
  }).join('')

  document.getElementById('tbl-content').innerHTML = `
    <table>
      <thead><tr>
        <th>예약번호</th><th>성함</th><th>연락처</th><th>패키지</th><th>날짜</th><th>인원</th><th>상태</th><th>액션</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`
}

async function openDetail(id) {
  try {
    const r = await fetch(`/api/applications/${id}`)
    const d = await r.json()
    currentApp = d
    const st = STATUS_MAP[d.status] || { label: d.status, cls: '' }

    const itinHtml = d.itinerary && d.itinerary.length
      ? `<table class="itin-table">
          <thead><tr><th>일차</th><th>날짜</th><th>픽업</th><th>드랍</th></tr></thead>
          <tbody>${d.itinerary.map(day => `<tr>
            <td>${day.day_number}일차</td>
            <td>${day.date_label}</td>
            <td>${day.pickup_time} ${day.pickup_loc}</td>
            <td>${day.dropoff_time} ${day.dropoff_loc}</td>
          </tr>`).join('')}</tbody>
        </table>`
      : '<p style="color:#9ca3af;font-size:12px">아직 일정이 없습니다. 바우처 빌더에서 일정을 작성하세요.</p>'

    document.getElementById('modal-title').innerHTML = `
      신청 상세 — <span class="badge ${st.cls}">${st.label}</span>
      <button class="modal-close" onclick="closeModal()">✕</button>`

    document.getElementById('modal-body').innerHTML = `
      <div class="info-grid">
        <div class="info-item"><div class="lbl">예약번호</div><div class="val"><strong>${d.reservation_no || '—'}</strong></div></div>
        <div class="info-item"><div class="lbl">패키지</div><div class="val">${d.package_type}</div></div>
        <div class="info-item"><div class="lbl">성함</div><div class="val">${d.name}</div></div>
        <div class="info-item"><div class="lbl">연락처</div><div class="val">${d.phone}</div></div>
        <div class="info-item"><div class="lbl">이메일</div><div class="val">${d.email || '미입력'}</div></div>
        <div class="info-item"><div class="lbl">인원</div><div class="val">${d.passengers}명</div></div>
        <div class="info-item"><div class="lbl">출발일</div><div class="val">${d.departure_date}</div></div>
        <div class="info-item"><div class="lbl">귀국일</div><div class="val">${d.return_date}</div></div>
        <div class="info-item" style="grid-column:1/-1"><div class="lbl">신청 채널</div><div class="val">${d.channel}</div></div>
        ${d.requests ? `<div class="info-item" style="grid-column:1/-1"><div class="lbl">요청사항</div><div class="val" style="line-height:1.7">${d.requests}</div></div>` : ''}
        ${d.voucher?.sent_at ? `<div class="info-item" style="grid-column:1/-1"><div class="lbl">바우처 발송일시</div><div class="val">${d.voucher.sent_at}</div></div>` : ''}
      </div>

      <hr class="sep">
      <div style="font-size:12px;font-weight:700;color:#6b7280;margin-bottom:8px">여행 일정</div>
      ${itinHtml}

      <hr class="sep">
      <div style="font-size:12px;font-weight:700;color:#6b7280;margin-bottom:8px">상태 변경</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select class="status-sel" id="status-sel">
          <option value="pending" ${d.status==='pending'?'selected':''}>대기 중</option>
          <option value="confirmed" ${d.status==='confirmed'?'selected':''}>일정 확정</option>
          <option value="voucher_sent" ${d.status==='voucher_sent'?'selected':''}>바우처 발송</option>
          <option value="completed" ${d.status==='completed'?'selected':''}>완료</option>
        </select>
        <button class="btn btn-dark btn-sm" onclick="updateStatus(${d.id})">상태 저장</button>
        <button class="btn btn-sm" style="background:#fee2e2;color:#D9251C" onclick="deleteApp(${d.id})">삭제</button>
      </div>

      <div class="modal-acts">
        <button class="btn btn-dark" onclick="openVoucher(${d.id});closeModal()">📄 바우처 빌더로 이동</button>
        ${d.email ? `<button class="btn btn-green" onclick="sendVoucherEmail(${d.id})" ${!d.voucher?'disabled title="먼저 바우처를 저장하세요"':''}>✉️ 바우처 이메일 발송</button>` : '<span style="font-size:12px;color:#9ca3af">이메일 미입력 (발송 불가)</span>'}
      </div>
    `

    document.getElementById('detail-modal').classList.add('open')
  } catch (err) {
    toast('상세 정보를 불러오지 못했습니다.')
  }
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('open')
  loadApps()
}

function openVoucher(id) {
  window.open(`/admin/voucher?appId=${id}`, '_blank')
}

async function quickStatus(id, status) {
  await fetch(`/api/applications/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) })
  toast('✅ 상태가 업데이트되었습니다.')
  loadApps()
}

async function updateStatus(id) {
  const status = document.getElementById('status-sel').value
  await fetch(`/api/applications/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) })
  toast('✅ 상태가 저장되었습니다.')
}

async function deleteApp(id) {
  if (!confirm('이 신청을 삭제하시겠습니까? 일정과 바우처 데이터도 함께 삭제됩니다.')) return
  await fetch(`/api/applications/${id}`, { method: 'DELETE' })
  toast('🗑️ 삭제되었습니다.')
  closeModal()
}

async function sendVoucherEmail(id) {
  const btn = event.target
  btn.disabled = true; btn.textContent = '발송 중...'
  try {
    const r = await fetch(`/api/vouchers/${id}/send`, { method: 'POST' })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error)
    toast('✉️ 바우처 이메일이 발송되었습니다!')
    closeModal()
  } catch (err) {
    alert('이메일 발송 실패: ' + err.message)
    btn.disabled = false; btn.textContent = '✉️ 바우처 이메일 발송'
  }
}

function setView(v) {
  document.querySelectorAll('.s-item').forEach(i => i.classList.remove('on'))
  event.target.classList.add('on')
}

// 모달 바깥 클릭 닫기
document.getElementById('detail-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal()
})

loadApps()
</script>
</body>
</html>

<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;font-variant-numeric:lining-nums}
:root{--ink:#12131a;--gold:#d9b45a;--goldd:#b98a3e;--sans:'Pretendard','Pretendard Variable',-apple-system,sans-serif}
body{background:#0a0a0f;font-family:var(--sans);-webkit-font-smoothing:antialiased}
.deck{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0 40px}
.card{position:relative;width:1080.0px;height:1080.0px;max-width:1080px;max-height:1080px;overflow:hidden;background:#12131a;color:#fff;scroll-snap-align:center;flex:none}
.hint{color:#8a8a92;font-size:13px;text-align:center;padding:10px}
/* 커버 */
.cover{display:flex;flex-direction:column;justify-content:center;padding:0 9%;background:radial-gradient(120% 90% at 50% 0%,#20222e,#0d0e15)}
.cover .brand{position:absolute;top:6.5%;left:9%;font-weight:800;letter-spacing:4px;font-size:25.9px;color:#fff}.cover .brand b{color:var(--gold)}
.cover .kick{color:var(--gold);font-weight:800;font-size:33.5px;letter-spacing:.5px;margin-bottom:23.8px}
.cover h1{font-size:92.9px;font-weight:900;line-height:1.18;letter-spacing:-.5px}
.cover h1 em{font-style:normal;color:var(--gold)}
.cover .sub{color:rgba(255,255,255,.8);font-size:33.5px;margin-top:32.4px;line-height:1.6}
.cover .swipe{position:absolute;bottom:7%;left:9%;color:rgba(255,255,255,.85);font-size:32.4px;font-weight:700}
.cover .swipe::after{content:' →'}
/* 아이템 */
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 40%,rgba(0,0,0,.55) 66%,rgba(10,10,15,.96) 100%)}
.rk{position:absolute;top:6%;left:8%;width:118.8px;height:118.8px;border-radius:50%;background:linear-gradient(135deg,#e7c877,#b98a3e);color:#231a08;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:64.8px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tag{position:absolute;top:8.4%;left:22%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:28.1px;font-weight:700;padding:10.8px 25.9px;border-radius:20px;backdrop-filter:blur(4px)}
.info{position:absolute;left:8%;right:8%;bottom:8%}
.info .nm{font-size:69.1px;font-weight:900;line-height:1.2;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.info .rt{display:inline-block;margin-top:25.9px;background:rgba(217,180,90,.16);border:1px solid rgba(217,180,90,.6);color:#f0d79c;font-weight:800;font-size:32.4px;padding:10.8px 28.1px;border-radius:10px}
.info .ds{color:rgba(255,255,255,.9);font-size:33.5px;line-height:1.55;margin-top:25.9px;word-break:keep-all}
/* CTA */
.cta{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 10%;background:radial-gradient(120% 90% at 50% 100%,#20222e,#0d0e15)}
.cta .brand{font-weight:800;letter-spacing:4px;font-size:32.4px;color:#fff;margin-bottom:43.2px}.cta .brand b{color:var(--gold)}
.cta h2{font-size:71.3px;font-weight:900;line-height:1.3}
.cta h2 em{font-style:normal;color:var(--gold)}
.cta p{color:rgba(255,255,255,.82);font-size:34.6px;line-height:1.7;margin-top:36.7px}
.cta .pill{margin-top:54.0px;background:linear-gradient(135deg,#e7c877,#b98a3e);color:#231a08;font-weight:900;font-size:36.7px;padding:25.9px 54.0px;border-radius:14px}
@media print{.hint{display:none}}
body{margin:0;background:#0a0a0f}.card{width:1080px;height:1080px;max-width:none;max-height:none}</style></head><body>
  <div class="card">
    <div class="ph" style="background-image:url('/guide/img/dotonbori-food-4.jpg')"></div><div class="shade"></div>
    <div class="rk">4</div><div class="tag">도톤보리</div>
    <div class="info">
      <div class="nm">암소 전문점 이타마에 야키니쿠 이치규 도톤보리 난바점</div>
      <span class="rt">구글 평점 4.9 ★ (5,776)</span>
      <div class="ds">암소 전문점으로 다양한 부위의 고기를 친절하게 설명해주어 맛있게 즐길 수 있는 야키니쿠 맛…</div>
    </div>
  </div>
</body></html>
